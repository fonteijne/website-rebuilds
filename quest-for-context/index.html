<!doctype html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>The Quest for Context</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script type="importmap">
      { "imports": { "three": "./vendor/three.module.min.js" } }
    </script>
    <style>
      @font-face {
        font-family: "Press Start 2P";
        src: url("assets/fonts/PressStart2P-Regular.ttf") format("truetype");
      }
      @font-face {
        font-family: "Silkscreen";
        src: url("assets/fonts/Silkscreen-Regular.ttf") format("truetype");
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #000;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
      }
      #px {
        position: absolute;
        left: 0;
        top: 0;
        width: 1920px;
        height: 1080px;
        z-index: 10;
      }
      #vignette {
        position: absolute;
        inset: 0;
        z-index: 100;
        pointer-events: none;
        background: radial-gradient(ellipse 80% 80% at 50% 50%, rgba(0, 0, 0, 0) 60%, rgba(0, 0, 0, 0.45) 100%);
      }
      #flash,
      #black {
        position: absolute;
        inset: 0;
        z-index: 120;
        background: #fffdf0;
        opacity: 0;
      }
      #black {
        z-index: 130;
        background: #000;
        opacity: 1;
      }
      #fx {
        position: absolute;
        inset: 0;
        z-index: 140;
        pointer-events: none;
      }
      #subtitle {
        position: absolute;
        left: 0;
        right: 0;
        top: 676px;
        z-index: 150;
        text-align: center;
        font-family: "Silkscreen", monospace;
        font-size: 46px;
        letter-spacing: 2px;
        color: #ffe7a3;
        text-shadow: 0 4px 0 #6b3d0c, 0 0 24px rgba(255, 200, 80, 0.55);
        opacity: 0;
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="95" data-width="1920" data-height="1080">
      <canvas id="px" width="1920" height="1080"></canvas>
      <div id="vignette"></div>
      <div id="flash"></div>
      <div id="black"></div>
      <canvas id="fx" width="1920" height="1080"></canvas>
      <div id="subtitle">The Holy Grail of AI Engineering</div>
      <audio id="soundtrack" src="assets/audio/soundtrack.mp3" data-start="0" data-duration="95" data-track-index="1" data-volume="1"></audio>
    </div>
    <script type="module">
      import { THREE, clamp, easeInOut, rng } from "./src3d/core.js";
      import { buildFilm, frame } from "./src3d/film.js";

      const TOTAL = 95, W = 1920, H = 1080, RW = 960, RH = 540;

      // ---------- overlays (closed-form envelopes: [peak, in, out, strength]) ----------
      const FLASHES = [
        [11.42, 0.08, 0.35, 0.35], [39.5, 0.12, 0.9, 1], [62.0, 1.4, 1.1, 1],
        [72.85, 0.1, 0.6, 0.45], [79.15, 0.1, 0.5, 0.35], [83.1, 0.15, 0.8, 0.5],
      ];
      const BLACKS = [[34.0, 0.45, 0.5, 1], [91.0, 0.7, 0.9, 1]];
      const env = (t, [p, i, o, s]) => (t < p - i || t > p + o ? 0 : (t <= p ? (t - (p - i)) / i : 1 - (t - p) / o) * s);

      // ---------- 3D renderer: low-res WebGL, upscaled with crisp pixels ----------
      const glc = document.createElement("canvas");
      const renderer = new THREE.WebGLRenderer({ canvas: glc, antialias: false, preserveDrawingBuffer: true });
      renderer.setPixelRatio(1);
      renderer.setSize(RW, RH, false);
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFShadowMap;
      const camera = new THREE.PerspectiveCamera(40, RW / RH, 0.05, 900);
      const out = document.getElementById("px").getContext("2d");
      out.imageSmoothingEnabled = false;

      // ---------- end title: golden pixels assemble (full-res canvas) ----------
      const cv = document.getElementById("fx");
      const ctx = cv.getContext("2d");
      let TITLE = [];
      function buildTitle() {
        const oc = document.createElement("canvas");
        oc.width = W;
        oc.height = H;
        const o = oc.getContext("2d");
        const pts = [];
        function sampleText(text, top, size) {
          o.clearRect(0, 0, W, H);
          o.font = size + 'px "Press Start 2P"';
          o.textBaseline = "top";
          o.fillStyle = "#fff";
          const cell = size / 8;
          const w = o.measureText(text).width;
          const x0 = Math.round((W - w) / 2 / cell) * cell;
          o.fillText(text, x0, top);
          const d = o.getImageData(0, 0, W, H).data;
          for (let y = top; y < top + size * 1.2; y += cell)
            for (let x = x0; x < x0 + w; x += cell) {
              const i = (Math.floor(y + cell / 2) * W + Math.floor(x + cell / 2)) * 4;
              if (d[i + 3] > 128) pts.push({ tx: x, ty: y, s: cell, kind: "text" });
            }
        }
        sampleText("CONTEXT", 392, 96);
        sampleText("ENGINEERING", 520, 96);
        o.clearRect(0, 0, W, H);
        const cx = 960, cy = 222, r = 104;
        const nodes = [[cx, cy - r], [cx + r, cy], [cx, cy + r], [cx - r, cy]];
        o.strokeStyle = "#fff";
        o.lineWidth = 10;
        o.fillStyle = "#fff";
        o.beginPath();
        nodes.forEach((n, i) => (i ? o.lineTo(n[0], n[1]) : o.moveTo(n[0], n[1])));
        o.closePath();
        o.stroke();
        nodes.forEach((n) => {
          o.beginPath();
          o.arc(n[0], n[1], 22, 0, 6.29);
          o.fill();
        });
        o.beginPath();
        o.arc(cx, cy, 30, 0, 6.29);
        o.fill();
        const d = o.getImageData(0, 0, W, H).data;
        for (let y = cy - r - 32; y < cy + r + 32; y += 8)
          for (let x = cx - r - 32; x < cx + r + 32; x += 8) {
            const i = ((y + 4) * W + (x + 4)) * 4;
            if (d[i + 3] > 128) pts.push({ tx: x, ty: y, s: 8, kind: "sym" });
          }
        const r3 = rng(7);
        TITLE = pts.map((p) => {
          const a = r3() * Math.PI * 2, rad = 500 + r3() * 900;
          return { ...p, sx: 960 + Math.cos(a) * rad, sy: 600 + Math.sin(a) * rad * 0.7, d: r3() * 0.8 + (p.kind === "sym" ? 0 : 0.35 + (p.tx / W) * 0.5), sw: (r3() - 0.5) * 260 };
        });
      }
      const goldAt = (y) => {
        const k = clamp((y - 380) / 240);
        return `rgb(255,${Math.round(236 - 70 * k)},${Math.round(150 - 110 * k)})`;
      };
      function star(x, y, s, a, col) {
        ctx.globalAlpha = a;
        ctx.fillStyle = col;
        ctx.fillRect(x - s * 3, y - s / 2, s * 6, s);
        ctx.fillRect(x - s / 2, y - s * 3, s, s * 6);
        ctx.fillRect(x - s, y - s, s * 2, s * 2);
      }
      function drawTitle(t) {
        ctx.clearRect(0, 0, W, H);
        if (t < 91.2 || !TITLE.length) return;
        const t0 = 91.3;
        const sweep = -300 + (t - 93.6) * 1600;
        ["shadow", "gold"].forEach((pass) => {
          TITLE.forEach((p) => {
            const q = clamp((t - t0 - p.d) / 1.25);
            if (q <= 0) return;
            const e = 1 - Math.pow(1 - q, 3);
            const x = p.sx + (p.tx - p.sx) * e + Math.sin(q * Math.PI) * p.sw;
            const y = p.sy + (p.ty - p.sy) * e;
            if (pass === "shadow") {
              if (q < 1) return;
              ctx.globalAlpha = 0.9;
              ctx.fillStyle = "#5a320a";
              ctx.fillRect(x, y + p.s / 2, p.s, p.s);
              return;
            }
            ctx.globalAlpha = q < 1 ? 0.55 + 0.45 * q : 1;
            const hl = Math.abs(p.tx + p.ty * 0.4 - sweep) < 60;
            ctx.fillStyle = q < 1 ? "#fff3c4" : hl ? "#fffbe8" : goldAt(p.kind === "sym" ? 380 + (p.ty - 118) * 0.6 : p.ty);
            ctx.fillRect(Math.round(x), Math.round(y), p.s, p.s);
          });
        });
        if (t > 93.0) {
          const r4 = rng(Math.floor((t - 92) * 4) + 999);
          const ph = ((t - 92) * 4) % 1;
          for (let i = 0; i < 6; i++) star(360 + r4() * 1200, 120 + r4() * 640, 3, Math.sin(ph * Math.PI) * 0.9, "#fff6d0");
        }
        ctx.globalAlpha = 1;
      }

      let F = null;
      function draw(t) {
        if (F) {
          const shot = frame(F, t);
          const world = F.worlds[shot.world];
          if (world.update) world.update(t);
          const [p, l, fov] = shot.cam;
          camera.position.set(p[0], p[1], p[2]);
          camera.lookAt(l[0], l[1], l[2]);
          if (camera.fov !== fov) {
            camera.fov = fov;
            camera.updateProjectionMatrix();
          }
          renderer.render(world.scene, camera);
          out.drawImage(glc, 0, 0, W, H);
        }
        let f = 0, b = t < 1.2 ? 1 - easeInOut(clamp(t / 1.2)) : 0;
        FLASHES.forEach((e) => (f = Math.max(f, env(t, e))));
        BLACKS.forEach((e) => (b = Math.max(b, env(t, e))));
        document.getElementById("flash").style.opacity = f.toFixed(3);
        document.getElementById("black").style.opacity = b.toFixed(3);
        drawTitle(t);
      }

      async function build() {
        await Promise.all([document.fonts.load('96px "Press Start 2P"'), document.fonts.load('46px "Silkscreen"')]).catch(() => {});
        F = buildFilm();
        buildTitle();
        const tl = gsap.timeline({ paused: true });
        tl.fromTo("#subtitle", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.8, ease: "power2.out" }, 93.3);
        const clock = { t: 0 };
        tl.fromTo(clock, { t: 0 }, { t: TOTAL, duration: TOTAL, ease: "none", onUpdate: () => draw(clock.t) }, 0);
        draw(0);
        window.__timelines["main"] = tl;
        if (window.__hfForceTimelineRebind) window.__hfForceTimelineRebind();
      }
      build();
    </script>
  </body>
</html>
